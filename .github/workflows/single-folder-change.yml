name: lax-database publication guard

on:
  push:
    branches:
      - "lax-publish/**"

permissions:
  contents: read

jobs:
  single-folder-change:
    name: single-folder-change
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/scripts/validate-publication.mjs
          path: guard
      - name: Require one canonical Archive folder
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: node guard/.github/scripts/validate-publication.mjs candidate "$CANDIDATE_SHA"
